name: cocogoat
services:
    sync:
        build: .
        restart: unless-stopped
        init: true
        read_only: true
        tmpfs:
            - /tmp:size=16m
        ports:
            - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080'
        environment:
            ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-https://keviince.github.io}'
        volumes:
            - sync_data:/data
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    'fetch("http://127.0.0.1:8080/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
        stop_grace_period: 30s
    https:
        image: caddy:2-alpine
        profiles: [https]
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        environment:
            SITE_DOMAIN: '${SITE_DOMAIN:-localhost}'
        volumes:
            - ./server/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            sync:
                condition: service_healthy
volumes:
    sync_data:
    caddy_data:
    caddy_config:
